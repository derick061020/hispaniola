[build]
  base = "app"
  command = "npm run build"
  publish = "dist"

# ── [v3 2026-08-06] EL SITIO PASA A INGLÉS: rutas ES → EN, 301 REALES ─────
#
# Los <Navigate> de App.tsx solo cubren la navegación DENTRO de la SPA. Quien
# entra directo por una URL vieja (enlace compartido, resultado de Google,
# material del cliente) necesita un 301 del servidor: un 200 al index.html
# haría que Google siguiera tratando la vieja como página propia.
#
# Van ANTES del catch-all — Netlify aplica la primera regla que casa.
# `force = true` para que el 301 gane también si existiera un archivo con esa
# ruta en dist.
#
# Los `:slug` son placeholders de Netlify: se capturan y se reinyectan en el
# destino. ⚠️ Netlify NO puede traducir el slug (bodas → weddings): eso lo
# hace RedirigeConSlug en App.tsx. Esta capa deja al visitante en la ruta EN
# con el slug viejo, y el router remata la traducción — dos saltos, pero el
# primero ya es el 301 que Google necesita.

[[redirects]]
  from = "/sostenibilidad"
  to = "/competitive-advantage"
  status = 301
  force = true

